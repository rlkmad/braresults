name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci || { echo "::warning::package-lock.json fora de sincronia com package.json; rode npm install localmente e envie o arquivo"; npm install; }; else echo "::warning::package-lock.json ausente; rode npm install localmente e envie o arquivo"; npm install; fi
      - run: npx cap add android
      - name: Copiar android-js-engine (Background Runner)
        run: |
          src=node_modules/@capacitor/background-runner/android/src/main/libs/android-js-engine-release.aar
          test -f "$src" || { echo "AAR nao encontrado em $src"; ls -R node_modules/@capacitor/background-runner/android | head -50; exit 1; }
          mkdir -p android/app/libs android/capacitor-cordova-android-plugins/src/main/libs
          cp "$src" android/app/libs/
          cp "$src" android/capacitor-cordova-android-plugins/src/main/libs/
      - run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $f || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n</manifest>#" $f
          cp -r android-res/* android/app/src/main/res/
          find android/app/src/main/res -name 'splash.png' -exec cp assets-src/splash.png {} \;
      - run: npx cap sync android
      - name: Versao a partir do package.json
        run: |
          V=$(node -p "require('./package.json').version")
          C=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number);a*10000+b*100+(c||0)")
          f=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $C/; s/versionName \"[^\"]*\"/versionName \"$V\"/" $f
          grep -nE "versionCode|versionName" $f
      - name: Assinatura fixa (se os Secrets existirem)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.keystore
            cat >> android/app/build.gradle <<EOF2
          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv('KS_PASS')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASS')
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          EOF2
            echo "MODE=release" >> $GITHUB_ENV
          else
            echo "::warning::Sem KEYSTORE_BASE64: gerando APK debug (assinatura muda a cada build)"
            echo "MODE=debug" >> $GITHUB_ENV
          fi
      - name: Compilar
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android && chmod +x gradlew
          if [ "$MODE" = release ]; then ./gradlew assembleRelease; else ./gradlew assembleDebug; fi
      - run: |
          if [ "$MODE" = release ]; then cp android/app/build/outputs/apk/release/app-release.apk Braresults.apk; else cp android/app/build/outputs/apk/debug/app-debug.apk Braresults.apk; fi
      - uses: actions/upload-artifact@v4
        with: { name: Braresults-APK, path: Braresults.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Braresults build ${{ github.run_number }}
          files: Braresults.apk
