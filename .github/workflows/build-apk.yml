name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - name: Copiar android-js-engine (Background Runner)
        run: |
          src=node_modules/@capacitor/background-runner/android/src/main/libs/android-js-engine-release.aar
          test -f "$src" || { echo "AAR nao encontrado em $src"; ls -R node_modules/@capacitor/background-runner/android | head -50; exit 1; }
          mkdir -p android/app/libs android/capacitor-cordova-android-plugins/src/main/libs
          cp "$src" android/app/libs/
          cp "$src" android/capacitor-cordova-android-plugins/src/main/libs/
      - run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $f || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n</manifest>#" $f
          cp -r android-res/* android/app/src/main/res/
          find android/app/src/main/res -name 'splash.png' -exec cp assets-src/splash.png {} \;
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Braresults.apk
      - uses: actions/upload-artifact@v4
        with: { name: Braresults-APK, path: Braresults.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Braresults build ${{ github.run_number }}
          files: Braresults.apk
