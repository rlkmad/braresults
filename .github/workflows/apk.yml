name: Build APK assinado
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências e criar projeto Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Aplicar ícone da urna
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dens=${d%%:*}; size=${d##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon.png -resize ${size}x${size} $RES/mipmap-$dens/$n.png
            done
          done

      - name: Compilar release (sem assinatura)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Preparar chave de assinatura
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            echo "Usando chave fixa dos Secrets"
          else
            keytool -genkeypair -v -keystore release.jks -alias braresults \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass braresults123 -keypass braresults123 \
              -dname "CN=Braresults, O=Braresults, C=BR"
            echo "Chave nova gerada"
          fi

      - name: Alinhar e assinar APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$UNSIGNED" aligned.apk
          $BT/apksigner sign --ks release.jks \
            --ks-key-alias braresults \
            --ks-pass pass:braresults123 --key-pass pass:braresults123 \
            --out Braresults.apk aligned.apk
          $BT/apksigner verify --verbose Braresults.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Braresults-APK
          path: Braresults.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chave-de-assinatura-GUARDE
          path: release.jks
